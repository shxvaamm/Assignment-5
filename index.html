<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime - TV Show Finder</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        line-height: 1.5;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .main-content {
        flex: 1;
      }
      .container {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 0;
      }
      .btn {
        padding: 8px 16px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn-hero,
      .btn-search {
        background-color: #2563eb;
        color: #fff;
      }
      .btn-hero:hover,
      .btn-search:hover {
        background-color: #1d4ed8;
      }
      .btn-reset {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #d1d5db;
      }
      .btn-reset:hover {
        background-color: #e5e7eb;
      }
      .btn-details {
        background-color: #111827;
        color: #fff;
        text-align: center;
        margin-top: 10px;
        font-size: 13px;
        padding: 6px 12px;
      }
      .btn-details:hover {
        background-color: #1f2937;
      }
      .hero-section {
        padding: 40px 0;
        text-align: center;
      }
      .hero-title {
        font-size: 36px;
        color: #111827;
        margin-bottom: 12px;
      }
      .hero-description {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 20px;
      }
      .home-header {
        text-align: center;
        margin-bottom: 20px;
      }
      .home-header h1 {
        font-size: 28px;
        color: #111827;
      }
      .controls-bar {
        margin-bottom: 20px;
      }
      .search-form {
        display: flex;
        gap: 8px;
        max-width: 500px;
        margin: 0 auto;
      }
      .search-input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      .search-input:focus {
        border-color: #2563eb;
      }
      .results-header {
        margin-bottom: 16px;
      }
      .results-header h3 {
        font-size: 15px;
        color: #4b5563;
        font-weight: 500;
      }
      .shows-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card-image-wrapper {
        width: 100%;
        height: 260px;
        background-color: #f3f4f6;
      }
      .card-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-content {
        padding: 12px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .card-title {
        font-size: 15px;
        color: #111827;
        margin-bottom: 4px;
      }
      .card-genre {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 8px;
      }
      .card-meta {
        font-size: 12px;
        color: #4b5563;
        margin-top: auto;
      }
      .status-message {
        text-align: center;
        padding: 40px 16px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .status-message h1 {
        font-size: 40px;
        color: #2563eb;
        margin-bottom: 8px;
      }
      .status-message h2 {
        font-size: 18px;
        color: #111827;
        margin-bottom: 6px;
      }
      .status-message p {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 16px;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .details-card {
        display: flex;
        gap: 24px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
      }
      .details-poster {
        flex-shrink: 0;
        width: 220px;
      }
      .details-poster img {
        width: 100%;
        border-radius: 6px;
        object-fit: cover;
      }
      .details-info {
        flex: 1;
      }
      .details-info h1 {
        font-size: 24px;
        color: #111827;
        margin-bottom: 10px;
      }
      .details-summary h3 {
        font-size: 16px;
        color: #111827;
        margin-bottom: 6px;
      }
      .details-summary p {
        color: #4b5563;
        font-size: 14px;
        line-height: 1.6;
      }
      .cast-section {
        margin-top: 24px;
      }
      .cast-section h2 {
        font-size: 18px;
        color: #111827;
        margin-bottom: 14px;
      }
      .cast-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        list-style: none;
        padding: 0;
        max-width: 600px;
      }
      .cast-item {
        font-size: 14px;
        color: #374151;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
      .no-cast {
        color: #6b7280;
        font-size: 13px;
        font-style: italic;
      }
      .about-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 24px;
      }
      .about-card h1 {
        font-size: 24px;
        color: #111827;
        margin-bottom: 6px;
      }
      .about-subtitle {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 20px;
      }
      .about-section {
        margin-bottom: 20px;
      }
      .about-section h2 {
        font-size: 16px;
        color: #111827;
        margin-bottom: 8px;
      }
      .about-section p {
        color: #4b5563;
        font-size: 14px;
        line-height: 1.6;
      }
      .about-list {
        padding-left: 18px;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.7;
      }
      .tech-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tech-tag {
        background: #f3f4f6;
        color: #1f2937;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
      }
      @media (max-width: 768px) {
        .details-card {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .details-poster {
          width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
